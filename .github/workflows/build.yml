name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [bazaar, myket]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: دانلود فونت فارسی
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/Vazirmatn-Regular.ttf https://github.com/rastikerdar/vazirmatn/raw/main/fonts/ttf/Vazirmatn-Regular.ttf
          curl -L -o assets/fonts/Vazirmatn-Bold.ttf https://github.com/rastikerdar/vazirmatn/raw/main/fonts/ttf/Vazirmatn-Bold.ttf

      - name: انتخاب پیاده‌سازی پرداخت (${{ matrix.store }})
        run: |
          cp store_variants/iap_service_${{ matrix.store }}.dart lib/data/iap_service.dart

      - name: افزودن وابستگی فروشگاه (${{ matrix.store }})
        run: |
          python3 - << 'PYEOF'
          store = "${{ matrix.store }}"
          dep_lines = {
              "bazaar": "  flutter_poolakey: ^2.2.0+1.0.0\n",
              "myket": "  myket_iap: ^1.0.1\n",
          }
          with open("pubspec.yaml") as f:
              c = f.read()
          marker = "  arabic_reshaper: ^0.0.1\n"
          assert marker in c, "marker line not found in pubspec.yaml"
          c = c.replace(marker, marker + dep_lines[store], 1)
          with open("pubspec.yaml", "w") as f:
              f.write(c)
          print("added dependency for", store)
          PYEOF

      - run: flutter pub get

      - name: پچ compileSdk و jcenter پکیج‌های وابسته
        run: |
          python3 - << 'PYEOF'
          import glob, re, os
          cache = os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          patched = []
          for gradle_file in glob.glob(f"{cache}/*/android/build.gradle") + glob.glob(f"{cache}/*/android/build.gradle.kts"):
              with open(gradle_file) as f:
                  c = f.read()
              orig = c
              is_kts = gradle_file.endswith(".kts")
              def bump(m):
                  return ('compileSdk = 36' if is_kts else 'compileSdk 36')
              c = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', c)
              c = re.sub(r'compileSdk\s*=?\s*\d+', bump, c)
              # jcenter() was fully shut down; every package still calling it
              # needs it swapped for mavenCentral() to resolve at all.
              c = c.replace('jcenter()', 'mavenCentral()')
              if c != orig:
                  with open(gradle_file, "w") as f:
                      f.write(c)
                  patched.append(gradle_file)
          print("patched:", patched)
          PYEOF

      - run: flutter create --platforms=android .

      - name: تنظیم applicationId یکتا
        run: |
          python3 - << 'INNEREOF'
          import re, os

          APP_ID = "ir.manatak.mekaaniyar"

          path = "android/app/build.gradle.kts"
          if not os.path.exists(path):
              path = "android/app/build.gradle"
          with open(path) as f:
              c = f.read()

          c = re.sub(r'namespace\s*=?\s*"[^"]*"', f'namespace = "{APP_ID}"', c, count=1)
          c = re.sub(r'applicationId\s*=?\s*"[^"]*"', f'applicationId = "{APP_ID}"', c, count=1)

          with open(path, "w") as f:
              f.write(c)
          print("applicationId set to", APP_ID, "in", path)
          INNEREOF

      - name: پچ JitPack repo (لازمه‌ی Poolakey/بازار)
        run: |
          python3 << 'PYEOF'
          import re, os

          def add_jitpack(path, is_kts):
              if not os.path.exists(path):
                  return False
              with open(path) as f:
                  c = f.read()
              if 'jitpack.io' in c:
                  return False
              jit = "maven { url = uri(\"https://jitpack.io\") }" if is_kts else "maven { url 'https://jitpack.io' }"
              m = re.search(r'(dependencyResolutionManagement\s*\{[^}]*repositories\s*\{)', c, re.S)
              if m:
                  idx = m.end()
                  c = c[:idx] + f"\n        {jit}" + c[idx:]
                  with open(path, 'w') as f:
                      f.write(c)
                  return True
              m = re.search(r'(allprojects\s*\{[^}]*repositories\s*\{)', c, re.S)
              if m:
                  idx = m.end()
                  c = c[:idx] + f"\n        {jit}" + c[idx:]
                  with open(path, 'w') as f:
                      f.write(c)
                  return True
              return False

          patched = False
          for path, is_kts in [
              ("android/settings.gradle.kts", True),
              ("android/settings.gradle", False),
              ("android/build.gradle.kts", True),
              ("android/build.gradle", False),
          ]:
              if add_jitpack(path, is_kts):
                  print("JitPack added to", path)
                  patched = True
          if not patched:
              print("WARNING: could not find a repositories block to patch")
          PYEOF

      - name: پچ مجوزهای بلوتوث (OBD2)
        run: |
          python3 - "android/app/src/main/AndroidManifest.xml" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              c = f.read()
          if 'BLUETOOTH_CONNECT' not in c:
              perms = (
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />'
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />'
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'
                  '\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />'
                  '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />'
                  '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              )
              idx = c.find('>', c.find('<manifest'))
              c = c[:idx+1] + perms + c[idx+1:]
          with open(path, 'w') as f:
              f.write(c)
          print('manifest patched')
          PYEOF

      - name: پچ Gradle
        run: |
          python3 - "android/app/build.gradle.kts" << 'PYEOF'
          import sys, re, os
          path = sys.argv[1]
          if not os.path.exists(path):
              path = "android/app/build.gradle"
          with open(path) as f:
              c = f.read()
          is_kts = path.endswith(".kts")
          c = re.sub(r'compileSdk\s*=?\s*\d+', ('compileSdk = 36' if is_kts else 'compileSdk 36'), c)
          # myket_iap ships classes compiled with Java 21 bytecode; our
          # own source/target compatibility must be at least that high
          # or javac refuses to read those class files.
          c = re.sub(r'JavaVersion\.VERSION_\d+(_\d+)?', 'JavaVersion.VERSION_21', c)
          # Flutter's own generated template already includes a
          # kotlin { compilerOptions { jvmTarget = ...JvmTarget.JVM_17 } }
          # block -- a completely different token pattern than
          # JavaVersion.VERSION_17, so the substitution above never
          # touched it. That's the actual block Gradle was reading,
          # which is why every previous attempt to add a *new* block
          # alongside it had no effect.
          c = re.sub(r'JvmTarget\.JVM_\d+', 'JvmTarget.JVM_21', c)
          c = re.sub(r'jvmTarget\s*=\s*[\'"]\d+[\'"]', 'jvmTarget = "21"', c)
          if "compileOptions {" not in c and "android {" in c:
              co = (
                  '\n    compileOptions {\n'
                  '        sourceCompatibility = JavaVersion.VERSION_21\n'
                  '        targetCompatibility = JavaVersion.VERSION_21\n'
                  '    }\n'
              ) if is_kts else (
                  '\n    compileOptions {\n'
                  '        sourceCompatibility JavaVersion.VERSION_21\n'
                  '        targetCompatibility JavaVersion.VERSION_21\n'
                  '    }\n'
              )
              idx = c.find("android {")
              brace_idx = c.find("{", idx) + 1
              c = c[:brace_idx] + co + c[brace_idx:]
          flag = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          if flag not in c and "compileOptions {" in c:
              c = c.replace("compileOptions {", f"compileOptions {{\n        {flag}", 1)
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
          if dep not in c:
              if "dependencies {" in c:
                  c = c.replace("dependencies {", f"dependencies {{\n    {dep}", 1)
              else:
                  c += f"\ndependencies {{\n    {dep}\n}}\n"
          store = "${{ matrix.store }}"
          if store == "myket" and "marketApplicationId" not in c:
              placeholders = (
                  '\n        manifestPlaceholders["marketApplicationId"] = "ir.mservices.market"\n'
                  '        manifestPlaceholders["marketBindAddress"] = "ir.mservices.market.InAppBillingService.BIND"\n'
                  '        manifestPlaceholders["marketPermission"] = "ir.mservices.market.BILLING"\n'
              ) if is_kts else (
                  '\n        manifestPlaceholders += [marketApplicationId: "ir.mservices.market",'
                  ' marketBindAddress: "ir.mservices.market.InAppBillingService.BIND",'
                  ' marketPermission: "ir.mservices.market.BILLING"]\n'
              )
              idx = c.find("defaultConfig {")
              if idx != -1:
                  brace_idx = c.find("{", idx) + 1
                  c = c[:brace_idx] + placeholders + c[brace_idx:]
          open(path, "w").write(c)
          print("patched OK, final content:")
          print(open(path).read())
          PYEOF

      - name: تنظیم امضای انتشار (Signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/mekaaniyar-release.jks

          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=mekaaniyar-release.jks
          EOF

          python3 - << 'PYEOF'
          import os

          path = "android/app/build.gradle.kts"
          is_kts = True
          if not os.path.exists(path):
              path = "android/app/build.gradle"
              is_kts = False

          with open(path) as f:
              c = f.read()

          if "key.properties" in c:
              print("signing config already present, skipping")
          else:
              if is_kts:
                  loader = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                  )
                  if loader not in c:
                      c = loader + c

                  keyprops_block = (
                      '\nval keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n'
                  )
                  idx = c.find("android {")
                  c = c[:idx] + keyprops_block + "\n" + c[idx:]

                  signing_block = (
                      '\n    signingConfigs {\n'
                      '        create("release") {\n'
                      '            keyAlias = keystoreProperties["keyAlias"] as String?\n'
                      '            keyPassword = keystoreProperties["keyPassword"] as String?\n'
                      '            storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }\n'
                      '            storePassword = keystoreProperties["storePassword"] as String?\n'
                      '        }\n'
                      '    }\n'
                  )
                  idx = c.find("android {")
                  brace_idx = c.find("{", idx) + 1
                  c = c[:brace_idx] + signing_block + c[brace_idx:]

                  import re
                  if re.search(r'buildTypes\s*\{', c):
                      def add_signing(m):
                          block = m.group(0)
                          if "signingConfig" not in block:
                              rb = block.find("{", block.find("release"))
                              block = block[:rb+1] + '\n            signingConfig = signingConfigs.getByName("release")' + block[rb+1:]
                          return block
                      c = re.sub(r'buildTypes\s*\{.*?\n    \}', add_signing, c, count=1, flags=re.S)
              else:
                  loader = "\nimport java.util.Properties\nimport java.io.FileInputStream\n"
                  if "import java.util.Properties" not in c:
                      c = loader + c

                  keyprops_block = (
                      '\ndef keystoreProperties = new Properties()\n'
                      'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                      '}\n'
                  )
                  idx = c.find("android {")
                  c = c[:idx] + keyprops_block + "\n" + c[idx:]

                  signing_block = (
                      '\n    signingConfigs {\n'
                      '        release {\n'
                      '            keyAlias keystoreProperties["keyAlias"]\n'
                      '            keyPassword keystoreProperties["keyPassword"]\n'
                      '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
                      '            storePassword keystoreProperties["storePassword"]\n'
                      '        }\n'
                      '    }\n'
                  )
                  idx = c.find("android {")
                  brace_idx = c.find("{", idx) + 1
                  c = c[:brace_idx] + signing_block + c[brace_idx:]

                  import re
                  if re.search(r'buildTypes\s*\{', c):
                      def add_signing(m):
                          block = m.group(0)
                          if "signingConfig" not in block:
                              rb = block.find("{", block.find("release"))
                              block = block[:rb+1] + '\n            signingConfig signingConfigs.release' + block[rb+1:]
                          return block
                      c = re.sub(r'buildTypes\s*\{.*?\n    \}', add_signing, c, count=1, flags=re.S)

              with open(path, "w") as f:
                  f.write(c)
              print("signing config added to", path)
          PYEOF

      - name: نمایش فایل نهایی برای عیب‌یابی
        run: |
          echo "=== android/app/build.gradle.kts ==="
          cat android/app/build.gradle.kts 2>/dev/null || echo "(فایل .kts وجود نداره)"
          echo "=== android/app/build.gradle (اگه بجاش این باشه) ==="
          cat android/app/build.gradle 2>/dev/null || echo "(فایل .gradle وجود نداره)"
          echo "=== لیست همه‌ی فایل‌های build.gradle موجود ==="
          find android -name "build.gradle*" -maxdepth 3

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mekaaniyar-${{ matrix.store }}
          path: build/app/outputs/flutter-apk/app-release.apk
