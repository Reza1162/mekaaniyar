<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="420" fill="#FFFFFF"/>

  <!-- Engine block -->
  <rect x="60" y="150" width="160" height="120" rx="8" fill="#F6EDEA" stroke="#C97A5E" stroke-width="1.5"/>
  <text x="140" y="205" font-size="14" fill="#7A3C25" text-anchor="middle" font-family="sans-serif">موتور</text>
  <text x="140" y="222" font-size="11" fill="#9C6248" text-anchor="middle" font-family="sans-serif">تولید حرارت</text>

  <!-- Water pump -->
  <circle cx="140" cy="320" r="34" fill="#EAF1FB" stroke="#5A7CA0" stroke-width="1.5"/>
  <text x="140" y="316" font-size="12" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">پمپ</text>
  <text x="140" y="330" font-size="12" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">آب</text>

  <!-- Thermostat -->
  <rect x="330" y="140" width="90" height="50" rx="6" fill="#FBF3E3" stroke="#C99A3B" stroke-width="1.5"/>
  <text x="375" y="162" font-size="12" fill="#7A5A16" text-anchor="middle" font-family="sans-serif">ترموستات</text>
  <text x="375" y="178" font-size="10" fill="#9C7C2E" text-anchor="middle" font-family="sans-serif">۸۲-۹۵°C</text>

  <!-- Radiator -->
  <rect x="500" y="60" width="180" height="220" rx="8" fill="#EAF1FB" stroke="#5A7CA0" stroke-width="1.5"/>
  <text x="590" y="90" font-size="14" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">رادیاتور</text>
  <!-- fins -->
  <g stroke="#B7CBE3" stroke-width="1">
    <line x1="520" y1="110" x2="660" y2="110"/>
    <line x1="520" y1="130" x2="660" y2="130"/>
    <line x1="520" y1="150" x2="660" y2="150"/>
    <line x1="520" y1="170" x2="660" y2="170"/>
    <line x1="520" y1="190" x2="660" y2="190"/>
    <line x1="520" y1="210" x2="660" y2="210"/>
    <line x1="520" y1="230" x2="660" y2="230"/>
    <line x1="520" y1="250" x2="660" y2="250"/>
  </g>

  <!-- Fan -->
  <circle cx="500" cy="330" r="30" fill="#F3F6FB" stroke="#5A7CA0" stroke-width="1.5"/>
  <g stroke="#5A7CA0" stroke-width="2">
    <line x1="500" y1="330" x2="500" y2="306"/>
    <line x1="500" y1="330" x2="521" y2="342"/>
    <line x1="500" y1="330" x2="479" y2="342"/>
  </g>
  <text x="500" y="378" font-size="12" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">فن</text>

  <!-- Expansion tank -->
  <rect x="330" y="290" width="100" height="70" rx="8" fill="#EAF7EF" stroke="#3B7A57" stroke-width="1.5"/>
  <text x="380" y="320" font-size="12" fill="#1F5C3A" text-anchor="middle" font-family="sans-serif">منبع</text>
  <text x="380" y="336" font-size="12" fill="#1F5C3A" text-anchor="middle" font-family="sans-serif">انبساط</text>

  <!-- Flow arrows -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A7CA0"/>
    </marker>
  </defs>
  <g stroke="#5A7CA0" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M220,180 H330,165"/>
    <path d="M420,165 H500,165"/>
    <path d="M140,150 V80 H330 V165"/>
    <path d="M140,286 V180"/>
    <path d="M430,325 H500,300"/>
  </g>
  <text x="270" y="172" font-size="10" fill="#5A7CA0" text-anchor="middle" font-family="sans-serif">آب داغ</text>
  <text x="270" y="70" font-size="10" fill="#5A7CA0" text-anchor="middle" font-family="sans-serif">مسیر بای‌پس (موتور سرد)</text>

  <!-- legend -->
  <g font-family="sans-serif" font-size="11" fill="#2C3E50">
    <text x="60" y="400">مسیر گردش: موتور → ترموستات → رادیاتور → پمپ → موتور</text>
  </g>
</svg>
