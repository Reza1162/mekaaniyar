<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="340" fill="#FFFFFF"/>

  <!-- Exhaust manifold -->
  <rect x="30" y="130" width="110" height="50" rx="6" fill="#F6EDEA" stroke="#C97A5E" stroke-width="1.5"/>
  <text x="85" y="160" font-size="12" fill="#7A3C25" text-anchor="middle" font-family="sans-serif">اگزوز موتور</text>

  <!-- Turbine side -->
  <circle cx="240" cy="155" r="55" fill="#FBEAE3" stroke="#C97A5E" stroke-width="1.5"/>
  <text x="240" y="150" font-size="12" fill="#7A3C25" text-anchor="middle" font-family="sans-serif">توربین</text>
  <text x="240" y="167" font-size="10" fill="#9C6248" text-anchor="middle" font-family="sans-serif">گاز داغ</text>

  <!-- Shaft -->
  <rect x="292" y="148" width="30" height="14" fill="#8A8A8A"/>

  <!-- Compressor side -->
  <circle cx="380" cy="155" r="55" fill="#EAF1FB" stroke="#5A7CA0" stroke-width="1.5"/>
  <text x="380" y="150" font-size="12" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">کمپرسور</text>
  <text x="380" y="167" font-size="10" fill="#5A7CA0" text-anchor="middle" font-family="sans-serif">هوای فشرده</text>

  <!-- Wastegate -->
  <rect x="200" y="230" width="90" height="40" rx="6" fill="#FBF3E3" stroke="#C99A3B" stroke-width="1.5"/>
  <text x="245" y="254" font-size="11" fill="#7A5A16" text-anchor="middle" font-family="sans-serif">Wastegate</text>

  <!-- Intercooler -->
  <rect x="470" y="120" width="140" height="70" rx="8" fill="#EAF1FB" stroke="#5A7CA0" stroke-width="1.5"/>
  <text x="540" y="150" font-size="12" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">اینترکولر</text>
  <text x="540" y="167" font-size="10" fill="#5A7CA0" text-anchor="middle" font-family="sans-serif">خنک‌کردن هوا</text>

  <!-- Intake manifold -->
  <rect x="660" y="130" width="90" height="50" rx="6" fill="#EAF7EF" stroke="#3B7A57" stroke-width="1.5"/>
  <text x="705" y="160" font-size="11" fill="#1F5C3A" text-anchor="middle" font-family="sans-serif">منیفولد ورودی</text>

  <!-- exhaust out -->
  <text x="240" y="70" font-size="11" fill="#7A3C25" text-anchor="middle" font-family="sans-serif">به اگزوز خروجی</text>

  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7A7A7A"/>
    </marker>
  </defs>
  <g stroke="#7A7A7A" stroke-width="2" fill="none" marker-end="url(#ah2)">
    <line x1="141" y1="155" x2="182" y2="155"/>
    <line x1="240" y1="100" x2="240" y2="78"/>
    <line x1="245" y1="210" x2="245" y2="228"/>
    <line x1="437" y1="155" x2="467" y2="155"/>
    <line x1="611" y1="155" x2="657" y2="155"/>
  </g>

  <!-- legend -->
  <g font-family="sans-serif" font-size="11" fill="#2C3E50">
    <text x="30" y="300">مسیر: اگزوز → توربین می‌چرخاند → از طریق محور کمپرسور را می‌گرداند → هوا فشرده و خنک می‌شود → موتور</text>
    <text x="30" y="318">Wastegate فشار زیاد را با هدایت بخشی از گاز به دور توربین کنترل می‌کند</text>
  </g>
</svg>
