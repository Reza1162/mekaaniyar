<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="360" fill="#FFFFFF"/>
  <!-- four stages side by side -->
  <!-- stage template: cylinder rect with piston, valves -->

  <!-- Stage 1: Intake -->
  <g>
    <rect x="30" y="40" width="150" height="250" rx="6" fill="#F3F6FB" stroke="#8AA9CC" stroke-width="1.5"/>
    <!-- cylinder bore -->
    <rect x="60" y="60" width="90" height="190" fill="#FFFFFF" stroke="#5A7CA0" stroke-width="1.5"/>
    <!-- piston near bottom (BDC) -->
    <rect x="63" y="180" width="84" height="60" fill="#C9D6E5" stroke="#5A7CA0" stroke-width="1.5"/>
    <!-- intake valve open (down) -->
    <rect x="70" y="60" width="10" height="30" fill="#3B7A57"/>
    <circle cx="75" cy="94" r="6" fill="#3B7A57"/>
    <!-- exhaust valve closed -->
    <rect x="125" y="60" width="10" height="14" fill="#B23A3A"/>
    <text x="105" y="270" font-size="13" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">مکش</text>
    <text x="105" y="288" font-size="11" fill="#5C6B7A" text-anchor="middle" font-family="sans-serif">سوپاپ ورودی باز</text>
  </g>

  <!-- Stage 2: Compression -->
  <g>
    <rect x="215" y="40" width="150" height="250" rx="6" fill="#F3F6FB" stroke="#8AA9CC" stroke-width="1.5"/>
    <rect x="245" y="60" width="90" height="190" fill="#FFFFFF" stroke="#5A7CA0" stroke-width="1.5"/>
    <!-- piston near top (TDC) -->
    <rect x="248" y="70" width="84" height="60" fill="#C9D6E5" stroke="#5A7CA0" stroke-width="1.5"/>
    <!-- both valves closed -->
    <rect x="255" y="60" width="10" height="14" fill="#B23A3A"/>
    <rect x="310" y="60" width="10" height="14" fill="#B23A3A"/>
    <text x="290" y="270" font-size="13" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">تراکم</text>
    <text x="290" y="288" font-size="11" fill="#5C6B7A" text-anchor="middle" font-family="sans-serif">هر دو سوپاپ بسته</text>
  </g>

  <!-- Stage 3: Power -->
  <g>
    <rect x="400" y="40" width="150" height="250" rx="6" fill="#F3F6FB" stroke="#8AA9CC" stroke-width="1.5"/>
    <rect x="430" y="60" width="90" height="190" fill="#FFFFFF" stroke="#5A7CA0" stroke-width="1.5"/>
    <!-- combustion flash near top -->
    <polygon points="440,70 460,90 450,75 475,95 465,72 500,88 480,68 510,80 490,65" fill="#F0A73C" opacity="0.85"/>
    <!-- piston moving down -->
    <rect x="433" y="150" width="84" height="60" fill="#C9D6E5" stroke="#5A7CA0" stroke-width="1.5"/>
    <rect x="440" y="60" width="10" height="14" fill="#B23A3A"/>
    <rect x="495" y="60" width="10" height="14" fill="#B23A3A"/>
    <text x="475" y="270" font-size="13" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">انبساط (قدرت)</text>
    <text x="475" y="288" font-size="11" fill="#5C6B7A" text-anchor="middle" font-family="sans-serif">احتراق، پیستون به پایین</text>
  </g>

  <!-- Stage 4: Exhaust -->
  <g>
    <rect x="585" y="40" width="150" height="250" rx="6" fill="#F3F6FB" stroke="#8AA9CC" stroke-width="1.5"/>
    <rect x="615" y="60" width="90" height="190" fill="#FFFFFF" stroke="#5A7CA0" stroke-width="1.5"/>
    <rect x="618" y="80" width="84" height="60" fill="#C9D6E5" stroke="#5A7CA0" stroke-width="1.5"/>
    <!-- exhaust valve open -->
    <rect x="685" y="60" width="10" height="30" fill="#3B7A57"/>
    <circle cx="690" cy="94" r="6" fill="#3B7A57"/>
    <rect x="625" y="60" width="10" height="14" fill="#B23A3A"/>
    <text x="660" y="270" font-size="13" fill="#2C3E50" text-anchor="middle" font-family="sans-serif">تخلیه</text>
    <text x="660" y="288" font-size="11" fill="#5C6B7A" text-anchor="middle" font-family="sans-serif">سوپاپ خروجی باز</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#8AA9CC" stroke-width="2" fill="none" marker-end="url(#arrowhead)">
    <line x1="182" y1="165" x2="212" y2="165"/>
    <line x1="367" y1="165" x2="397" y2="165"/>
    <line x1="552" y1="165" x2="582" y2="165"/>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8AA9CC"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-family="sans-serif" font-size="12" fill="#2C3E50">
    <rect x="30" y="315" width="14" height="14" fill="#3B7A57"/>
    <text x="50" y="326">سوپاپ باز</text>
    <rect x="150" y="315" width="14" height="14" fill="#B23A3A"/>
    <text x="170" y="326">سوپاپ بسته</text>
    <rect x="290" y="315" width="14" height="14" fill="#C9D6E5" stroke="#5A7CA0"/>
    <text x="310" y="326">پیستون</text>
  </g>
</svg>
