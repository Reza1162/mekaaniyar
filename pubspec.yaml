name: mekaaniyar
description: دستیار فنی مکانیک خودرو
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.3
  bluetooth_classic: ^0.0.4
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  share_plus: ^10.0.2
  pdf: ^3.11.1
  arabic_reshaper: ^0.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/content/
    - assets/icon/
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
